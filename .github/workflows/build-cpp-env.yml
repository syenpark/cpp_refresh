name: Build MLE Cpp Container

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Containerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile # 💡 GitHub에게 이 파일을 읽으라고 지정합니다.
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/hft-cpp-env:latest

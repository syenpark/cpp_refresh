name: Build MLE Cpp Container

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Containerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry with Podman
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Podman image
        run: |
          image="ghcr.io/${{ github.actor }}/mle-cpp-env:latest"
          podman build --file ./Containerfile --tag "$image" .
          podman push "$image"

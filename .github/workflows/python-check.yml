name: Python Code Quality

on:
  push:
    branches: [main, develop]
    paths:
      - "src/python/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-check.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/python/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-check.yml"

jobs:
  python-path-check:
    name: Check Python Path
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether src/python exists
        id: check
        run: |
          if [ -d src/python ] && [ -n "$(find src/python -type f \( -name '*.py' -o -name '*.pyi' \) -print -quit)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  ruff-lint:
    name: Ruff - Lint
    runs-on: ubuntu-latest
    needs: python-path-check
    if: needs.python-path-check.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Run ruff lint
        run: uv run --group dev -- ruff check --force-exclude src/python

  ruff-format:
    name: Ruff - Format
    runs-on: ubuntu-latest
    needs: python-path-check
    if: needs.python-path-check.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Check formatting
        run: uv run --group dev -- ruff format --check --force-exclude src/python

  mypy:
    name: mypy - Type Check
    runs-on: ubuntu-latest
    needs: python-path-check
    if: needs.python-path-check.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Run mypy
        run: uv run --group dev -- mypy src/python

  trailing-whitespace:
    name: Trailing Whitespace
    runs-on: ubuntu-latest
    needs: python-path-check
    if: needs.python-path-check.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Run trailing-whitespace-fixer
        run: |
          find src/python -type f \( -name "*.py" -o -name "*.pyi" \) | xargs -r uv run --group dev -- trailing-whitespace-fixer
          if git diff --exit-code; then
            echo "✓ No trailing whitespace found"
          else
            echo "✗ Trailing whitespace detected. Run: uv run -- trailing-whitespace-fixer to fix"
            exit 1
          fi

  end-of-file-fixer:
    name: End of File Fixer
    runs-on: ubuntu-latest
    needs: python-path-check
    if: needs.python-path-check.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Run end-of-file-fixer
        run: |
          find src/python -type f \( -name "*.py" -o -name "*.pyi" \) | xargs -r uv run --group dev -- end-of-file-fixer
          if git diff --exit-code; then
            echo "✓ All files end with newline"
          else
            echo "✗ Files missing final newline. Run: uv run -- end-of-file-fixer to fix"
            exit 1
          fi

  check-merge-conflict:
    name: Check Merge Conflicts
    runs-on: ubuntu-latest
    needs: python-path-check
    if: needs.python-path-check.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Check merge conflicts
        run: |
          find src/python -type f -name "*.py" | \
            xargs -r uv run --group dev -- check-merge-conflict --assume-in-merge

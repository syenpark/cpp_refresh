apiVersion: batch/v1
kind: Job
metadata:
  name: sweep
  namespace: team-a
spec:
  parallelism: 4
  completions: 4
  template:
    metadata: {}
    spec:
      containers:
      - command:
        - sh
        - -c
        - sleep 120
        image: busybox:1.36
        name: sweep
        resources:
          limits:
            cpu: 400m
            memory: 128Mi
          requests:
            cpu: 400m
            memory: 128Mi
      restartPolicy: Never
status: {}

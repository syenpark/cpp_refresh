apiVersion: v1
kind: Namespace
metadata: {name: team-a}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: team-a-quota, namespace: team-a}
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata: {name: team-a-defaults, namespace: team-a}
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 100m, memory: 64Mi}
    default: {cpu: 200m, memory: 128Mi}
---
apiVersion: batch/v1
kind: Job
metadata: {name: sweep, namespace: team-a}
spec:
  parallelism: 4
  completions: 4
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trial
        image: busybox:1.36
        command: ["sh", "-c", "sleep 120"]
        resources:
          requests: {cpu: 400m, memory: 128Mi}
          limits: {cpu: 400m, memory: 128Mi}
